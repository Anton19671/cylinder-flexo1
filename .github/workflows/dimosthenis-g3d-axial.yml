name: Dimosthenis 2024 exact axial G3D limit
on:
  push:
    branches: [verify-dimosthenis-g3d-20261126]
permissions:
  contents: read
env:
  PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface:ci"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python ci/dimosthenis_2024_g3d_axial.py --preflight --output preflight
  physical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        nx: [21,41]
        kind: [STATIC,NEWMARK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python ci/dimosthenis_2024_g3d_axial.py --nx ${{ matrix.nx }} --kind ${{ matrix.kind }} --output result
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axial-${{ matrix.kind }}-${{ matrix.nx }}
          path: result/
