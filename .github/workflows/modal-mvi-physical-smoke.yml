name: Modal MKR vs MVI physical smoke
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_mvi_physical_smoke.py"
      - ".github/workflows/modal-mvi-physical-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver requirements
        run: python -m pip install -r requirements.txt
      - name: Execute physical KL modal MKR versus MVI1 MVI2
        run: python ci/modal_mvi_physical_smoke.py
      - name: Upload modal smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-mkr-mvi-physical-smoke
          path: modal_mvi_physical_smoke_result.json
          if-no-files-found: warn
