name: Cammalleri KL plane stress versus 3D diagnostic
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_cammalleri_plane_stress_diagnostic.py"
      - "tests/test_modal_cammalleri_plane_stress_diagnostic.py"
      - ".github/workflows/modal-cammalleri-plane-stress-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Confirm current 3D KL and Fourier regressions are unchanged
        run: python -m pytest -q tests/test_modal_kl_exact_tangent.py tests/test_modal_fourier_thin_shell_accuracy.py tests/test_modal_cammalleri_plane_stress_diagnostic.py
      - name: Contrast physical 3D and plane stress diagnostic constitutive laws
        run: python ci/modal_cammalleri_plane_stress_diagnostic.py
      - name: Store independently identified material-model comparison and fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cammalleri-kl-plane-stress-versus-3d
          path: |
            modal_cammalleri_3d_vs_plane_stress.json
            modal_cammalleri_*_fields.npz
          if-no-files-found: warn
