name: Verify exact KL coupled clamp in modal MVI
on:
  push:
    branches: [main]
    paths:
      - "numerics/cylinder_modal_axial_traces.py"
      - "numerics/cylinder_modal_mvi.py"
      - "numerics/cylinder_modal_reference.py"
      - "tests/test_modal_mvi_kl_coupled_axial_traces.py"
      - ".github/workflows/modal-kl-coupled-clamp-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kl-clamp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run KL exact slope and separated MVI variation tests
        run: python -m pytest -q tests/test_modal_mvi_kl_coupled_axial_traces.py tests/test_modal_mvi_mkr_branch_isolation.py tests/test_modal_matrixfree_column_vectors.py
