name: Profile true modal MVI-5 against MKR FDM
on:
  push:
    branches: [main]
    paths:
      - ci/modal_mvi_cpu_profile.py
      - numerics/cylinder_modal_mvi.py
      - .github/workflows/modal-mvi-cpu-profile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Profile same Cammalleri geometry and grid
        run: python ci/modal_mvi_cpu_profile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-mvi-cpu-profile
          path: modal_mvi_cpu_profile_result.json
          if-no-files-found: warn
