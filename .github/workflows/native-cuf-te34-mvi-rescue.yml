name: Native CUF TE3 TE4 gradient MVI equilibrated reduced LU
run-name: "CUF TE3 TE4 physical reduced-MVI GMRES/LU investigation - ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-cuf-te34-mvi-rescue.yml"
      - "independent_mvi/coupled_halfstep.py"
      - "independent_mvi/coupled_static.py"
permissions:
  contents: read
jobs:
  loaded-cuf:
    name: "REAL ${{ matrix.theory }} ${{ matrix.gradient }} MVI-1"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        theory: [CUF_TE3, CUF_TE4]
        gradient: [G3D, Gz]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      THEORY: ${{ matrix.theory }}
      GRADIENT: ${{ matrix.gradient }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Run actual same-rank nonlinear MVI with direct checked reduced LU
        shell: bash
        run: |
          mkdir -p failure_logs
          set -o pipefail
          python -u ci/native_flexo_loaded_models.py \
            --theory "$THEORY" --gradient "$GRADIENT" \
            --reduced-lu-rescue-limit 256 \
            --reduced-solver DENSE_LU \
            --output "physical/${THEORY}_${GRADIENT}" \
            2>&1 | tee "failure_logs/${THEORY}_${GRADIENT}.log"
      - name: Preserve input, reduced tangent and failure history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "CUF_TE34_RESCUE_${{ matrix.theory }}_${{ matrix.gradient }}"
          path: |
            physical/
            failure_logs/
          if-no-files-found: warn
          retention-days: 60
