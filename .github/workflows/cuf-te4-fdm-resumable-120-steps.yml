name: CUF TE4 full FDM Bathe 120 steps in restartable physical batches
run-name: "120 real CUF TE4 FDM steps / 12 verified checkpoint batches after #${{ github.event.workflow_run.id }}"
on:
  workflow_run:
    workflows: ["CUF TE4 real long linear dynamics and plot data"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  batch_01:
    name: "CUF TE4 FDM real accepted batch 01/12"
    if: ${{ github.event.workflow_run.id == 41809844866 }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ced64d2333cc721e789fd4d3c6f829a934edafdd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install physical solver and chart dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate identical 120-step CUF TE4 FDM physical CASE
        run: |
          python ci/generate_linear_bathe_case.py \
            --theory CUF_TE4 --method FDM --steps 120 --dt 0.002 \
            --output config/verification/cuf_te4_long_linear

      - name: Restore original accepted FDM output if the source run archived it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p original_fdm
          if gh run download 41809844866 --repo "$GITHUB_REPOSITORY" \
              --name CUF_TE4_LONG_LINEAR_DYNAMIC_PHYSICAL_HISTORY_AND_GRAPHS \
              --dir original_fdm; then
            python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("original_fdm")
          matches=list(root.rglob("FINAL_RUN_SUMMARY.json"))
          if len(matches)!=1:
              raise ValueError("ORIGINAL_FDM_ARCHIVE_AMBIGUOUS")
          source=matches[0].parent
          destination=Path("config/verification/cuf_te4_long_linear/output/CUF_TE4_FDM")
          if destination.exists():
              raise ValueError("ORIGINAL_FDM_DESTINATION_ALREADY_EXISTS")
          shutil.copytree(source,destination)
          print("ORIGINAL_REAL_FDM_STEPS_RESTORED",source,flush=True)
          PY
          else
            echo "No source archive: begin real physics from initial state."
          fi

      - name: Execute up to 10 NEW accepted physical Bathe steps
        shell: bash
        run: |
          set -o pipefail
          python -u ci/run_bathe_checkpoint_batch.py \
            config/verification/cuf_te4_long_linear/CUF_TE4_FDM.json \
            --new-steps 10
      - name: Export real accepted signals and color graphs
        if: always()
        shell: bash
        run: |
          if [ -f config/verification/cuf_te4_long_linear/output/CUF_TE4_FDM/FINAL_RUN_SUMMARY.json ]; then
            python ci/export_bathe_te4_history.py config/verification/cuf_te4_long_linear/output/CUF_TE4_FDM
          else
            echo "No accepted solver summary; no synthetic history can be exported."
          fi
      - name: Save CASE and all accepted Bathe checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CUF_TE4_FDM_BATCH_01_ACCEPTED_PHYSICAL
          path: config/verification/cuf_te4_long_linear/
          retention-days: 60
          if-no-files-found: warn

  batch_02:
