name: One-time cancel five superseded modal runs
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-time-cancel-superseded-modal-runs.yml"]
permissions:
  contents: read
  actions: write
jobs:
  cancel-exact-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel exact superseded runs and preserve artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = "Anton19671/cylinder-flexo1"
          targets = [[44239636352,"e77c6d09358ff8f566ec0e4ddda7e112501804ca",".github/workflows/modal-mvi-all-ranks-theories.yml"],[44252185748,"67c4369da287ff35d874bd1b3821a121f50b6855",".github/workflows/modal-mvi-all-ranks-theories.yml"],[44267049136,"be1d50f31359352bd16b648fcb6f4fef005aafec",".github/workflows/modal-cammalleri-user-gui-matrix.yml"],[44254331452,"5d47b981138f37178ca11bdc36befa7e2276d401",".github/workflows/modal-cammalleri-user-gui-matrix.yml"],[44252185647,"67c4369da287ff35d874bd1b3821a121f50b6855",".github/workflows/modal-cammalleri-user-gui-matrix.yml"]]
          def request(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=b"" if method == "POST" else None,
                  method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          for run_id, expected_sha, expected_path in targets:
              run = request("/actions/runs/" + str(run_id))
              if run["head_sha"] != expected_sha or run["path"] != expected_path:
                  raise RuntimeError("Refusing mismatched run " + str(run_id))
              if run["status"] == "completed":
                  print("ALREADY_COMPLETED", run_id, run["conclusion"], flush=True)
                  continue
              request("/actions/runs/" + str(run_id) + "/cancel", "POST")
              print("CANCELLATION_REQUESTED", run_id, run["name"], flush=True)
          PY
