name: Gao-Park native plane-strain benchmark
on:
  push:
    branches: ["benchmark/gao-park-plane-strain"]
    paths: [".github/workflows/gao-park-native.yml", "ci/gao_park_plane_strain.py", "ci/gao_park_linear_local.py", "ci/gao_park_native_series.py"]
  workflow_dispatch:
concurrency:
  group: gao-park-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        order: [1, 2, 3, 4]
        ell_index: [0, 1, 2, 3]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Independent native FDM and MVI1-8 on three grids with audited linear local kernel
        run: python -u ci/gao_park_native_series.py --order ${{ matrix.order }} --ell-index ${{ matrix.ell_index }} --output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GAO_PARK_NATIVE_TE${{ matrix.order }}_ELL${{ matrix.ell_index }}_ALL_GRIDS
          path: evidence/
          if-no-files-found: error
