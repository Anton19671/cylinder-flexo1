name: Gao-Park native plane-strain benchmark
on:
  push:
    branches: ["benchmark/gao-park-plane-strain"]
    paths: [".github/workflows/gao-park-native.yml", "ci/gao_park_plane_strain.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        order: [1, 2, 3, 4]
        ell_index: [0, 1, 2, 3]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Native FDM and MVI fixed ranks 1-8
        shell: bash
        run: |
          mkdir -p evidence
          bad=0
          for method in FDM MVI; do
            ranks="0"
            if [ "$method" = MVI ]; then ranks="1 2 3 4 5 6 7 8"; fi
            for rank in $ranks; do
              out="evidence/${method}_${rank}"
              mkdir -p "$out"
              args=()
              if [ "$method" = MVI ]; then args=(--rank "$rank"); fi
              set +e
              timeout 480 python -u ci/gao_park_plane_strain.py --order ${{ matrix.order }} --ell-index ${{ matrix.ell_index }} --method "$method" "${args[@]}" --output "$out" > "$out/run.log" 2>&1
              rc=$?
              set -e
              echo "$rc" > "$out/exit_code.txt"
              cat "$out/run.log"
              if [ "$rc" -ne 0 ]; then bad=1; fi
            done
          done
          exit "$bad"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GAO_PARK_TE${{ matrix.order }}_ELL${{ matrix.ell_index }}
          path: evidence/
          if-no-files-found: error
