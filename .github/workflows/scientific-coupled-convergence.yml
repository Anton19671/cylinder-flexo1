name: Scientific coupled shell real mesh time rank convergence
run-name: "REAL convergence ${{ github.event.inputs.scope || 'pilot' }} - ${{ github.sha }}"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "pilot = eight real controlled cases; full = thirteen real controlled cases"
        required: true
        type: choice
        options: [pilot, full]
        default: pilot
permissions:
  contents: read
jobs:
  preflight:
    name: Scientific CASE and physics-passport checks (no physical solves)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:ci:interface:mechanics:numerics:physics:flexoelectric"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Validate all thirteen cases without advancing the solver
        run: python -m pytest -q tests/test_scientific_coupled_convergence.py tests/test_scientific_real_case_generation.py tests/test_scientific_coupled_field_compare.py
      - name: Build only the requested physical comparison cases
        id: matrix
        env:
          SCIENTIFIC_SCOPE: ${{ github.event.inputs.scope || 'pilot' }}
        shell: bash
        run: echo "value=$(python ci/scientific_coupled_convergence.py matrix --scope "$SCIENTIFIC_SCOPE")" >> "$GITHUB_OUTPUT"
  physical:
    name: "REAL ${{ matrix.case.id }}"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: ${{ fromJSON(needs.preflight.outputs.matrix).include }}
    env:
      PYTHONPATH: ".:ci:interface:mechanics:numerics:physics:flexoelectric"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: "Agg"
      CASE_ID: ${{ matrix.case.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Execute the real reference shell and verify accepted states
        shell: bash
        run: |
          mkdir -p convergence_logs
          set -o pipefail
          python -u ci/scientific_coupled_convergence.py run \
            --id "$CASE_ID" --output "convergence_cases/$CASE_ID" \
            2>&1 | tee "convergence_logs/$CASE_ID.log"
      - name: Preserve exact input, physical fields, provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "SCI_CONVERGENCE_${{ matrix.case.id }}"
          path: |
            convergence_cases/
            convergence_logs/
          retention-days: 60
          if-no-files-found: warn
  analyze:
    name: Numerical differences from matching physical passports
    needs: [preflight,physical]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:ci:interface:mechanics:numerics:physics:flexoelectric"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: SCI_CONVERGENCE_*
          path: downloaded
          merge-multiple: true
      - name: Compare only matching physical models; reject missing cases
        env:
          SCIENTIFIC_SCOPE: ${{ github.event.inputs.scope || 'pilot' }}
        shell: bash
        run: python -u ci/scientific_coupled_convergence.py compare --root downloaded --output scientific_comparison --scope "$SCIENTIFIC_SCOPE"
      - name: Audit actual FDM and separated MVI stress and electric fields
        shell: bash
        run: python -u ci/scientific_coupled_field_compare.py --root downloaded --output scientific_comparison
      - name: Preserve comparison tables including on failed campaigns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCI_CONVERGENCE_COMPARISON
          path: scientific_comparison/
          retention-days: 60
          if-no-files-found: warn
