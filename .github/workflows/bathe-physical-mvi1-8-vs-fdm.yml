name: Bathe KL physical 2 steps MVI1-8 and FDM parallel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "interface/cylinder_bathe_case.py"
      - "numerics/cylinder_bathe_mvi.py"
      - "interface/cylinder_reference_case.py"
      - "config/verification/kl_cc_bathe/**"
      - ".github/workflows/bathe-physical-mvi1-8-vs-fdm.yml"
permissions:
  contents: read
jobs:
  physical:
    name: "Bathe two true steps: ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        case: [BATHE_FDM, BATHE_MVI1, BATHE_MVI2, BATHE_MVI3, BATHE_MVI4, BATHE_MVI5, BATHE_MVI6, BATHE_MVI7, BATHE_MVI8]
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Independent Bathe physical Y X MVI substeps
        shell: bash
        run: |
          mkdir -p bathe_logs
          set +e
          python RUN_FINAL_CASE.py "config/verification/kl_cc_bathe/${{ matrix.case }}.json" > "bathe_logs/${{ matrix.case }}.log" 2>&1
          code=$?
          set -e
          tail -n 34 "bathe_logs/${{ matrix.case }}.log"
          echo "BATHE_PHYSICAL_EXIT=$code"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "bathe-real-${{ matrix.case }}"
          path: |
            bathe_logs/${{ matrix.case }}.log
            config/verification/kl_cc_bathe/output/${{ matrix.case }}/
          if-no-files-found: warn
          retention-days: 14
