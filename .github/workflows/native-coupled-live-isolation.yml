name: Native FDM MVI strict coupled route isolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/test_native_coupled_live_route_isolation.py"
      - "tests/test_native_flexo_face_pressure_parity.py"
      - "ci/native_flexo_loaded_models.py"
      - ".github/workflows/native-coupled-live-isolation.yml"
      - "independent_mkr/run_coupled_research.py"
      - "independent_mvi/run_coupled_research.py"
      - "independent_mvi/coupled_*.py"
      - "numerics/cylinder_direct_strong_*.py"
      - "numerics/cylinder_native_mkr_*.py"
      - "interface/cylinder_independent_dispatch.py"
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Forbid shared reference kernels and method crossover in executable routes
        run: python -m pytest -q tests/test_native_coupled_live_route_isolation.py tests/test_native_coupled_mkr_case_dispatch.py tests/test_independent_coupled_mvi_case_dispatch.py tests/test_native_flexo_face_pressure_parity.py
