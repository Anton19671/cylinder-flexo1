name: Export reproducible Rawat eight-mode CASE bundle
on:
  push:
    branches: [main]
    paths:
      - 'ci/export_rawat_eight_mode_cases.py'
      - '.github/workflows/modal-rawat-case-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: '.:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 PyYAML==6.0.3
      - name: Export only, no calculations
        run: python ci/export_rawat_eight_mode_cases.py
      - name: Verify package has 36 effective CASE files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmark_case_bundle')
          m=json.loads((p/'MANIFEST.json').read_text(encoding='utf-8'))
          assert len(m['files'])==36
          for row in m['files']:
              assert (p/row['run_case']).is_file()
              assert (p/row['source_template']).is_file()
          print('CASE_BUNDLE_36_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rawat-CUF-TE1-TE4-eight-mode-36-CASEs
          path: benchmark_case_bundle/
          if-no-files-found: error
