name: Native MVI ranks 1 to 8 actual physical one-step controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci/native_coupled_mvi_all_ranks_physical_smoke.py"
      - ".github/workflows/native-mvi-ranks-physical-smoke.yml"
permissions:
  contents: read
jobs:
  native-mvi-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install physical numerical dependencies
        run: python -m pip install numpy scipy
      - name: Run 24 actual rank-1..8 independent MVI one-step physical cases
        run: python -u ci/native_coupled_mvi_all_ranks_physical_smoke.py
