name: Native gradient flexo FDM MVI1-8 full STATIC and Newmark matrix
run-name: "Native G3D Gz 7 theories FDM vs MVI 1-8 STATIC+DYNAMIC - ${{ github.sha }}"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "pilot=16 cases KL only; full=252 cases all theories G3D/Gz"
        required: true
        type: choice
        options: [pilot, full]
        default: pilot
  push:
    branches: [main]
    paths:
      - "ci/native_gradient_fdm_mvi_campaign.py"
      - "tests/test_native_gradient_fdm_mvi_campaign.py"
      - ".github/workflows/native-gradient-fdm-mvi-full.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      scope: ${{ steps.matrix.outputs.scope }}
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Verify full 252-case model passport, rank seeds and pressure parity without solving
        run: python -m pytest -q tests/test_native_gradient_fdm_mvi_campaign.py tests/test_native_coupled_live_route_isolation.py
      - name: Create 252-case physical matrix on push, explicit selected scope otherwise
        id: matrix
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ github.event.inputs.scope || 'full' }}
        run: |
          set -euo pipefail
          echo "value=$(python ci/native_gradient_fdm_mvi_campaign.py matrix --scope "$REQUESTED_SCOPE")" >> "$GITHUB_OUTPUT"
          echo "scope=$REQUESTED_SCOPE" >> "$GITHUB_OUTPUT"
  physical:
    needs: preflight
    name: "REAL ${{ matrix.case.id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.preflight.outputs.matrix).include }}
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CASE_ID: ${{ matrix.case.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Independently solve full loaded physical gradient flexoelectric CASE
        shell: bash
        run: |
          mkdir -p physical_logs
          set -o pipefail
          python -u ci/native_gradient_fdm_mvi_campaign.py run \
            --id "$CASE_ID" --output "physical/$CASE_ID" \
            2>&1 | tee "physical_logs/$CASE_ID.log"
      - name: Always preserve source CASE, accepted fields, real failures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "NATIVE_GRADIENT_${{ matrix.case.id }}"
          path: |
            physical/
            physical_logs/
          retention-days: 60
          if-no-files-found: warn
  compare:
    needs: [preflight, physical]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: NATIVE_GRADIENT_*
          path: collected
          merge-multiple: true
      - name: Compare only matched FDM/MVI physical passports and actual full fields
        shell: bash
        env:
          SCOPE: ${{ needs.preflight.outputs.scope }}
        run: |
          set -euo pipefail
          python -u ci/native_gradient_fdm_mvi_campaign.py compare \
            --root collected --output comparison --scope "$SCOPE"
      - name: Keep all 224 comparisons and incomplete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NATIVE_GRADIENT_224_PAIR_COMPARISONS
          path: comparison/
          retention-days: 60
          if-no-files-found: warn
