name: Coupled flexoelectric dynamic physical control
run-name: "Nonzero flexo KL Newmark FDM MVI dynamic control - ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coupled-flexo-dynamic-control.yml"
permissions:
  contents: read
jobs:
  dynamic:
    name: "DYNAMIC ${{ matrix.gradient }} ${{ matrix.method }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        gradient: [G3D, Gz]
        method: [FDM, MVI_R1]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CASE_ID: "KL_${{ matrix.gradient }}_DYNAMIC_${{ matrix.method }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Solve actual nonzero coupled dynamic field and preserve failures
        shell: bash
        run: |
          mkdir -p dynamic_logs
          set -o pipefail
          python -u ci/native_gradient_fdm_mvi_campaign.py run \
            --id "$CASE_ID" --output "dynamic/$CASE_ID" \
            2>&1 | tee "dynamic_logs/$CASE_ID.log"
      - name: Keep inputs, accepted steps, residuals and exact failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "COUPLED_DYNAMIC_${{ matrix.gradient }}_${{ matrix.method }}"
          path: |
            dynamic/
            dynamic_logs/
          retention-days: 60
          if-no-files-found: warn
