name: All seven static dynamic gradient flexoelectric branch matrix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scientific-static-dynamic-branches.yml"
      - "tests/test_scientific_static_dynamic_branches.py"
      - "interface/cylinder_reference_case.py"
      - "mechanics/cylinder_functional_assembly.py"
      - "numerics/cylinder_boundary_spatial.py"
      - "mechanics/cylinder_kelvin_voigt.py"
      - "flexoelectric/flexo_gradient_g3d.py"
      - "flexoelectric/flexo_scale_policy.py"
permissions:
  contents: read
jobs:
  all-branches:
    name: 28 physical branches static/dynamic + 112 CASE preflights
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ".:interface:mechanics:numerics:physics:flexoelectric"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent audit dependencies
        run: python -m pip install numpy scipy pytest
      - name: Verify static dynamic gradient and flexoelectric CASE matrix
        run: |
          python -m py_compile tests/test_scientific_static_dynamic_branches.py
          python -m pytest -q tests/test_scientific_static_dynamic_branches.py tests/test_gradient_model_gz.py tests/test_dynamic_electric_g3d_gz_consistency.py tests/test_all_seven_flexo_gradient_nonzero.py
