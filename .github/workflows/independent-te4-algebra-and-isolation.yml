name: Independent CUF TE4 MKR MVI algebra and architecture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-te4-algebra-and-isolation.yml"
      - "independent_mkr/**"
      - "independent_mvi/**"
      - "tests/test_independent_te4_solver_isolation.py"
      - "tests/test_independent_te4_temporal_routes.py"
      - "tests/test_independent_mkr_seven_theories.py"
      - "tests/test_independent_mvi_seven_theories.py tests/test_independent_42_cases.py"
      - "tests/test_independent_42_cases.py"
      - "config/verification/independent_te4/**"
      - "config/verification/independent_all_models/**"
permissions:
  contents: read
jobs:
  algebra-only:
    name: Independent MKR and MVI operator isolation; no physical time integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install algebraic test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Compile two independent solvers and run operator-only tests
        run: |
          python -m py_compile independent_mkr/linear_te4.py independent_mvi/linear_te4.py independent_mkr/run_case.py independent_mvi/run_case.py independent_mkr/linear_models.py independent_mvi/linear_models.py independent_mkr/run_models.py independent_mvi/run_models.py
          python -m pytest -q tests/test_independent_te4_solver_isolation.py tests/test_independent_te4_temporal_routes.py tests/test_independent_mkr_seven_theories.py tests/test_independent_mvi_seven_theories.py
      - name: Validate each physical CASE with its own runner without computing
        run: |
          for integrator in BATHE NEWMARK GAUSS_IRK4; do
            python -m independent_mkr.run_case --case "config/verification/independent_te4/MKR_${integrator}.json" --validate-only > /dev/null
            python -m independent_mvi.run_case --case "config/verification/independent_te4/MVI_${integrator}.json" --validate-only > /dev/null
          done
