name: Real coupled G3D Gz static dynamic scientific pilot
run-name: "Real coupled shell ${{ github.event.inputs.scope || 'pilot' }} - ${{ github.sha }}"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "pilot: 8 real cases; full: all 112 cases (high computational cost)"
        required: true
        type: choice
        options: [pilot, full]
        default: pilot
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.enumerate.outputs.matrix }}
    env:
      PYTHONPATH: ".:ci:interface:mechanics:numerics:physics:flexoelectric"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Validate exact CASE generation without solving physics
        run: python -m pytest -q tests/test_scientific_real_case_generation.py
      - name: Build pilot or full physical matrix
        id: enumerate
        env:
          SCOPE: ${{ github.event.inputs.scope || 'pilot' }}
        run: echo "matrix=$(python ci/scientific_real_coupled_case.py matrix --scope "$SCOPE")" >> "$GITHUB_OUTPUT"
  physical:
    needs: prepare
    name: "REAL ${{ matrix.case.id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.matrix).include }}
    env:
      PYTHONPATH: ".:ci:interface:mechanics:numerics:physics:flexoelectric"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
      PYTHONDONTWRITEBYTECODE: "1"
      CASE_ID: ${{ matrix.case.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Solve real coupled equations; never substitute a failed field
        shell: bash
        run: |
          mkdir -p scientific_physical_logs
          set -o pipefail
          python -u ci/scientific_real_coupled_case.py run \
            --id "$CASE_ID" --output "scientific_physical/$CASE_ID" \
            2>&1 | tee "scientific_physical_logs/$CASE_ID.log"
      - name: Preserve CASE, real NPZ fields, provenance and failure journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "SCI_REAL_${{ matrix.case.id }}"
          path: |
            scientific_physical/
            scientific_physical_logs/
          retention-days: 60
          if-no-files-found: warn
