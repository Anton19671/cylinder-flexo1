name: Bathe MVI/FDM variational time integrator regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "numerics/cylinder_bathe_mvi.py"
      - "tests/test_cylinder_bathe_mvi.py"
      - ".github/workflows/bathe-variational-mvi-tests.yml"
permissions:
  contents: read
jobs:
  bathe-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify Bathe two-stage kinematics and physical MVI/FDM dispatch
        run: python -m pytest -q tests/test_cylinder_bathe_mvi.py
