name: Exact G3D axial limit - all MVI ranks and time integrators
on:
  push:
    branches: [verify-dimosthenis-all-ranks-integrators-20261126]
permissions:
  contents: read
env:
  PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface:ci"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python ci/dimosthenis_2024_all_ranks.py --preflight --output preflight
  physical:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        rank: [0,1,2,3,4,5,6,7,8]
        kind: [STATIC,NEWMARK,BATHE,GAUSS_IRK4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - run: python ci/dimosthenis_2024_all_ranks.py --nx 21 --rank ${{ matrix.rank }} --kind ${{ matrix.kind }} --output result
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axial-${{ matrix.kind }}-R${{ matrix.rank }}
          path: result/
