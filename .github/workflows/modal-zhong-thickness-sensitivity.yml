name: "Zhong: Rawat shell thickness h over R study"
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_zhong_thickness_sensitivity.py"
      - ".github/workflows/modal-zhong-thickness-sensitivity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thickness:
    name: ${{ matrix.theory }} h/R 0.025 0.05 0.10
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        theory: [CUF_TE1, CUF_TE4]
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: "Compute three physical thickness ratios at grid 21x21"
        run: python ci/modal_zhong_thickness_sensitivity.py "${{ matrix.theory }}" --grid 21
      - name: Store physical mode and thickness comparison data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhong-thickness-${{ matrix.theory }}
          path: |
            zhong_thickness_${{ matrix.theory }}_21x21.json
            zhong_thickness_${{ matrix.theory }}_21_*.npz
          if-no-files-found: warn
