name: Flexo1 full physical verification launch
run-name: "Flexo1 full coupled physics, convergence and MVI ranks - ${{ github.sha }}"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-flexo1-physical-launch.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  launch:
    name: Dispatch all real full-scope scientific campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Launch 112-case full G3D Gz physical matrix
        run: |
          set -euo pipefail
          gh workflow run scientific-real-coupled-physical.yml --ref main --field scope=full
      - name: Launch 13-case full grid time rank convergence
        run: |
          set -euo pipefail
          gh workflow run scientific-coupled-convergence.yml --ref main --field scope=full
      - name: Launch 9-case FDM versus MVI 1 through 8 nonaxisymmetric comparison
        run: |
          set -euo pipefail
          gh workflow run scientific-coupled-rank-1-8.yml --ref main
      - name: Link GitHub Actions runs
        if: always()
        run: |
          echo "The three full campaigns have been dispatched when the corresponding steps succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect individual workflow runs and their physical artifacts in the repository Actions page." >> "$GITHUB_STEP_SUMMARY"
