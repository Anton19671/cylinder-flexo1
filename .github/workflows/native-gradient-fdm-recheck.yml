name: KL gradient FDM recheck after circumferential stencil fix
run-name: "KL G3D/Gz FDM static and dynamic - ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-gradient-fdm-recheck.yml"
      - "ci/native_gradient_fdm_mvi_campaign.py"
      - "independent_mkr/run_coupled_research.py"
      - "numerics/cylinder_mkr_field_jets.py"
      - "numerics/cylinder_native_mkr_newmark.py"
      - "numerics/cylinder_native_mkr_bathe.py"
      - "numerics/cylinder_native_mkr_gauss2.py"
permissions:
  contents: read
jobs:
  physical:
    name: "KL ${{ matrix.gradient }} ${{ matrix.kind }} FDM"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gradient: [G3D, Gz]
        kind: [STATIC, DYNAMIC]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CASE_ID: "KL_${{ matrix.gradient }}_${{ matrix.kind }}_FDM"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Run same physical case on current revision
        shell: bash
        run: |
          mkdir -p physical_logs
          set -o pipefail
          python -u ci/native_gradient_fdm_mvi_campaign.py run \
            --id "$CASE_ID" --output "physical/$CASE_ID" \
            2>&1 | tee "physical_logs/$CASE_ID.log"
      - name: Preserve input, accepted states and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "FDM_RECHECK_${{ matrix.gradient }}_${{ matrix.kind }}"
          path: |
            physical/
            physical_logs/
          retention-days: 60
          if-no-files-found: warn
