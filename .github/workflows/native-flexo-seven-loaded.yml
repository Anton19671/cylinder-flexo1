name: Native flexo seven theories G3D Gz nonzero loaded MVI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci/native_flexo_loaded_models.py"
      - ".github/workflows/native-flexo-seven-loaded.yml"
permissions:
  contents: read
jobs:
  real:
    name: "REAL ${{ matrix.theory }} ${{ matrix.gradient }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        theory: [KL, FSDT, REDDY, CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        gradient: [G3D, Gz]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      THEORY: ${{ matrix.theory }}
      GRADIENT: ${{ matrix.gradient }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy
      - name: Execute real nonzero loaded nonlinear flexoelectric coupled MVI
        shell: bash
        run: |
          mkdir -p physical_logs
          set -o pipefail
          python -u ci/native_flexo_loaded_models.py \
            --theory "$THEORY" --gradient "$GRADIENT" \
            --output "native_physical/${THEORY}_${GRADIENT}" \
            2>&1 | tee "physical_logs/${THEORY}_${GRADIENT}.log"
      - name: Preserve CASE, fields, traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "NATIVE_FLEXO_${{ matrix.theory }}_${{ matrix.gradient }}"
          path: |
            native_physical/
            physical_logs/
          retention-days: 60
          if-no-files-found: warn
