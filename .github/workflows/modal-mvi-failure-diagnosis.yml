name: Diagnose MVI modal missing modes
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_mvi_failure_diagnosis.py"
      - ".github/workflows/modal-mvi-failure-diagnosis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Probe modal MVI branch sensitivity and constraint ranks
        run: python ci/modal_mvi_failure_diagnosis.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-mvi-failure-diagnosis
          path: modal_mvi_failure_diagnosis_result.json
          if-no-files-found: warn
