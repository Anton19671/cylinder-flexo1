name: Native MVI 1-8 real KL G3D Gz static dynamic 32 loaded cases
run-name: "Real KL flexo MVI-1..8 G3D/Gz statics and dynamics - ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci/native_mvi_kl_all_ranks_loaded.py"
      - ".github/workflows/native-mvi-kl-32-loaded-ranks.yml"
permissions:
  contents: read
jobs:
  physical-ranks:
    name: "REAL KL ${{ matrix.gradient }} ${{ matrix.kind }} MVI-${{ matrix.rank }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gradient: [G3D, Gz]
        kind: [STATIC, DYNAMIC]
        rank: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver physical dependencies
        run: python -m pip install numpy scipy
      - name: Run physical nonaxisymmetric fixed-rank MVI problem
        shell: bash
        env:
          RANK: ${{ matrix.rank }}
          GRADIENT: ${{ matrix.gradient }}
          KIND: ${{ matrix.kind }}
        run: |
          set -o pipefail
          mkdir -p rank_logs
          python -u ci/native_mvi_kl_all_ranks_loaded.py \
            --rank "$RANK" --gradient "$GRADIENT" --kind "$KIND" \
            --output "rank_cases/${GRADIENT}_${KIND}_R${RANK}" \
            2>&1 | tee "rank_logs/${GRADIENT}_${KIND}_R${RANK}.log"
      - name: Preserve physical solutions and exact solver failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "KL_MVI_${{ matrix.gradient }}_${{ matrix.kind }}_R${{ matrix.rank }}"
          path: |
            rank_cases/
            rank_logs/
          retention-days: 60
          if-no-files-found: warn
