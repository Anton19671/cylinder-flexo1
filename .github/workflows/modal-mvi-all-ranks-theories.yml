name: Modal MVI 56 theory-rank combinations
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_mvi_all_ranks_theories_audit.py"
      - "numerics/cylinder_modal_mvi.py"
      - "ci/modal_mvi_case_comparison.py"
      - "ci/modal_mvi_matrix_report.py"
      - "tests/test_modal_mvi_matrix_report.py"
      - ".github/workflows/modal-mvi-all-ranks-theories.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal:
    strategy:
      fail-fast: false
      # A separate runner for each of 56 combinations over-schedules
      # hosted capacity. Run four ranks in each job, preserving their
      # separate comparison JSON and field arrays.
      max-parallel: 2
      matrix:
        model: [KL, FSDT, REDDY, CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        group: [low, high]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver requirements
        run: python -m pip install -r requirements.txt
      - name: Compare four rank cases independently against MKR/FDM
        shell: bash
        run: |
          if [ "${{ matrix.group }}" = "low" ]; then
            ranks="1 2 3 4"
          else
            ranks="5 6 7 8"
          fi
          failures=0
          for rank in $ranks; do
            echo "::group::${{ matrix.model }} MVI-$rank vs FDM"
            python ci/modal_mvi_all_ranks_theories_audit.py "${{ matrix.model }}" "$rank" || failures=1
            echo "::endgroup::"
          done
          exit "$failures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-${{ matrix.model }}-rankgroup-${{ matrix.group }}
          path: |
            modal_${{ matrix.model }}_rank*_audit.json
            modal_${{ matrix.model }}_rank*_*.npz
          if-no-files-found: warn

  consolidate:
    # A green individual job means nothing unless both frequencies and
    # degenerate physical mass-MAC subspaces match the full FDM baseline.
    name: Check all 56 saved comparisons
    if: ${{ always() }}
    needs: [modal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download every available theory-rank audit, including failed jobs
        uses: actions/download-artifact@v4
        with:
          pattern: modal-*-rankgroup-*
          path: modal-matrix-56-input
          merge-multiple: true
      - name: Verify 56 physical spectral and mass-MAC comparisons
        run: python ci/modal_mvi_matrix_report.py
        env:
          MODAL_MATRIX_ARTIFACT_DIR: modal-matrix-56-input
      - name: Upload complete matrix report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-56-frequency-and-mass-mac-report
          path: modal-matrix-56-report/
          if-no-files-found: warn
