name: Modal MVI 56 theory-rank combinations
# The 56 exhaustive shell solves are manually dispatched. Running the
# matrix on every tiny MVI optimization commit created duplicate long jobs,
# delayed targeted regressions and exhausted GitHub Actions minutes. The
# fast per-rank projection and modal regression workflows remain automatic.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal:
    strategy:
      fail-fast: false
      # Each rank is isolated: a slow or cancelled rank cannot prevent
      # other ranks from producing their independent audit artifacts.
      max-parallel: 4
      matrix:
        model: [KL, FSDT, REDDY, CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        rank: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver requirements
        run: python -m pip install -r requirements.txt
      - name: Compare one rank independently against FDM
        run: python ci/modal_mvi_all_ranks_theories_audit.py "${{ matrix.model }}" "${{ matrix.rank }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-${{ matrix.model }}-rank-${{ matrix.rank }}
          path: |
            modal_${{ matrix.model }}_rank*_audit.json
            modal_${{ matrix.model }}_rank*_*.npz
          if-no-files-found: warn

  consolidate:
    # A green individual job means nothing unless both frequencies and
    # degenerate physical mass-MAC subspaces match the full FDM baseline.
    name: Check all 56 saved comparisons
    if: ${{ always() }}
    needs: [modal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download every available theory-rank audit, including failed jobs
        uses: actions/download-artifact@v4
        with:
          pattern: modal-*-rank-*
          path: modal-matrix-56-input
          merge-multiple: true
      - name: Verify 56 physical spectral and mass-MAC comparisons
        run: python ci/modal_mvi_matrix_report.py
        env:
          MODAL_MATRIX_ARTIFACT_DIR: modal-matrix-56-input
      - name: Upload complete matrix report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-56-frequency-and-mass-mac-report
          path: modal-matrix-56-report/
          if-no-files-found: warn
