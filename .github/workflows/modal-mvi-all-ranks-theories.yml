name: Modal MVI ranks 2-8 all theories
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_mvi_all_ranks_theories_audit.py"
      - ".github/workflows/modal-mvi-all-ranks-theories.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model: [KL, FSDT, REDDY, CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        rank: [2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver requirements
        run: python -m pip install -r requirements.txt
      - name: Compare modal branches
        run: python ci/modal_mvi_all_ranks_theories_audit.py ${{ matrix.model }} ${{ matrix.rank }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-${{ matrix.model }}-rank${{ matrix.rank }}
          path: |
            modal_${{ matrix.model }}_rank${{ matrix.rank }}_audit.json
            modal_${{ matrix.model }}_rank${{ matrix.rank }}_*.npz
          if-no-files-found: warn
