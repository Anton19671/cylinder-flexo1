name: Matched SAT targeted integration
on:
  push:
    branches: [verify-matched-sat-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-sat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface:ci"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Targeted spatial and temporal tests
        run: |
          python -m pytest -q --tb=short tests/test_matched_axial.py tests/test_matched_axial_quartic.py tests/test_matched_strong_sat_unit.py tests/test_matched_strong_sat_integration.py tests/test_native_coupled_mkr_case_dispatch.py tests/test_native_gradient_fdm_mvi_campaign.py tests/test_native_mkr_initial.py tests/test_native_mkr_newmark.py tests/test_native_mkr_bathe.py tests/test_native_mkr_gauss2.py
