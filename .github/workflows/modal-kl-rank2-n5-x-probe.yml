name: Diagnose KL rank-two initial X step
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_kl_rank2_n5_x_probe.py"
      - ".github/workflows/modal-kl-rank2-n5-x-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Check rank-two initial X step
        run: python ci/modal_kl_rank2_n5_x_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kl-rank2-n5-x-probe
          path: |
            modal_KL_rank2_audit.json
            modal_KL_rank2_*.npz
          if-no-files-found: warn
