name: Literature BaTiO3 25x33 large FDM vs MVI1-8
run-name: "Deng Shang 2024 params: REAL 25x33 closed-cylinder FDM vs MVI1-8 - ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci/literature_deng_shang_2024_large_compare.py"
      - ".github/workflows/literature-deng-shang-2024-large.yml"
permissions:
  contents: read
jobs:
  physical-case:
    name: "BaTiO3 25x33 ${{ matrix.gradient }} ${{ matrix.method }} rank-${{ matrix.rank }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {gradient: G3D, method: ENERGY_FDM, rank: 0}
          - {gradient: G3D, method: MVI, rank: 1}
          - {gradient: G3D, method: MVI, rank: 2}
          - {gradient: G3D, method: MVI, rank: 3}
          - {gradient: G3D, method: MVI, rank: 4}
          - {gradient: G3D, method: MVI, rank: 5}
          - {gradient: G3D, method: MVI, rank: 6}
          - {gradient: G3D, method: MVI, rank: 7}
          - {gradient: G3D, method: MVI, rank: 8}
          - {gradient: Gz, method: ENERGY_FDM, rank: 0}
          - {gradient: Gz, method: MVI, rank: 1}
          - {gradient: Gz, method: MVI, rank: 2}
          - {gradient: Gz, method: MVI, rank: 3}
          - {gradient: Gz, method: MVI, rank: 4}
          - {gradient: Gz, method: MVI, rank: 5}
          - {gradient: Gz, method: MVI, rank: 6}
          - {gradient: Gz, method: MVI, rank: 7}
          - {gradient: Gz, method: MVI, rank: 8}
    env:
      PYTHONPATH: ".:ci:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver numerical packages
        run: python -m pip install numpy scipy
      - name: Run published-parameter physical Green-Lagrange shell
        shell: bash
        env:
          GRADIENT: ${{ matrix.gradient }}
          METHOD: ${{ matrix.method }}
          RANK: ${{ matrix.rank }}
        run: |
          set -o pipefail
          mkdir -p paper_logs
          if [ "$METHOD" = "MVI" ]; then
            python -u ci/literature_deng_shang_2024_large_compare.py run \
              --gradient "$GRADIENT" --method "$METHOD" --rank "$RANK" \
              --output "paper_cases/${GRADIENT}_MVI_R${RANK}" \
              2>&1 | tee "paper_logs/${GRADIENT}_MVI_R${RANK}.log"
          else
            python -u ci/literature_deng_shang_2024_large_compare.py run \
              --gradient "$GRADIENT" --method "$METHOD" \
              --output "paper_cases/${GRADIENT}_ENERGY_FDM" \
              2>&1 | tee "paper_logs/${GRADIENT}_ENERGY_FDM.log"
          fi
      - name: Preserve true numerical states or exact failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "PAPER25_${{ matrix.gradient }}_${{ matrix.method }}_R${{ matrix.rank }}"
          path: |
            paper_cases/
            paper_logs/
          retention-days: 60
          if-no-files-found: warn
  compare:
    name: Compare all 16 MVI vs independent energy FDM fields
    needs: physical-case
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy for field comparison
        run: python -m pip install numpy
      - name: Collect all successes and failures
        uses: actions/download-artifact@v4
        with:
          pattern: PAPER25_*
          merge-multiple: true
          path: gathered/
      - name: Compare method-owned fields and record failures
        run: python -u ci/literature_deng_shang_2024_large_compare.py compare --source gathered --output paper_comparison
      - name: Upload complete comparison table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PAPER25_BaTiO3_FDM_MVI1_8_COMPARISON
          path: paper_comparison/
          retention-days: 60
          if-no-files-found: warn
