name: Cammalleri modal Fourier K/M action diagnosis
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/modal-cammalleri-km-diagnosis.yml"
      - "numerics/cylinder_modal_fourier_fdm.py"
      - "numerics/cylinder_modal_mvi.py"
      - "tests/test_modal_kl_exact_tangent.py"
      - "ci/modal_article_benchmarks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Regression of Fourier mode checks
        run: python -m pytest -q tests/test_modal_fourier_fdm.py tests/test_modal_fourier_bc_spaces.py tests/test_modal_fourier_thin_shell_accuracy.py tests/test_modal_kl_exact_tangent.py
      - name: Diagnose Cammalleri 12-mode Fourier certification
        run: python ci/modal_article_benchmarks.py cammalleri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cammalleri-km-action-diagnostic
          path: modal_article_cammalleri2023_result.json
          if-no-files-found: warn
