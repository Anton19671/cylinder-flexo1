name: Independent temporal convergence and energy verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/independent-temporal-scientific.yml"
      - "tests/test_independent_temporal_scientific.py"
      - "independent_mkr/linear_models.py"
      - "independent_mvi/linear_models.py"
permissions:
  contents: read
jobs:
  temporal-scientific:
    name: Independent scalar Newmark/Bathe/Gauss4 analytical oscillator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install temporal test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Static syntax and manufactured temporal convergence
        run: |
          python -m py_compile independent_mkr/linear_models.py independent_mvi/linear_models.py tests/test_independent_temporal_scientific.py
          python -m pytest -q tests/test_independent_temporal_scientific.py
