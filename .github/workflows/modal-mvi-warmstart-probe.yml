name: Modal MVI X-conditioned harmonic seed probe
on:
  push:
    branches: [main]
    paths:
      - ci/modal_mvi_warmstart_probe.py
      - .github/workflows/modal-mvi-warmstart-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warmstart:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Test fixed-harmonic initial X variation without changing solver
        run: python ci/modal_mvi_warmstart_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-mvi-warmstart-forensic
          path: modal_mvi_warmstart_probe_result.json
          if-no-files-found: warn
