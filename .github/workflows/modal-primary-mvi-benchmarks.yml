name: Primary MVI Rawat Cammalleri benchmark cross grids
on:
  push:
    branches: [main]
    paths:
      - "ci/modal_primary_mvi_benchmarks.py"
      - ".github/workflows/modal-primary-mvi-benchmarks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solve:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        study: [rawat_te1_17x17, rawat_te4_17x17, rawat_te4_21x21, cammalleri_kl_13x21, cammalleri_kl_17x31, cammalleri_kl_21x41]
        group: [low, high, mkr]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run independent MVI ranks or MKR control
        run: python ci/modal_primary_mvi_benchmarks.py ${{ matrix.study }} ${{ matrix.group }}
      - name: Preserve every completed, failed and unsupported case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-${{ matrix.study }}-${{ matrix.group }}
          path: benchmark_modal_primary/${{ matrix.study }}/${{ matrix.group }}/
          if-no-files-found: warn
  consolidate:
    if: ${{ always() }}
    needs: [solve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: primary-*
          path: benchmark_downloads
      - name: Restore per-study and per-group structure
        shell: bash
        run: |
          mkdir -p benchmark_modal_primary
          for d in benchmark_downloads/primary-*; do
            [ -d "$d" ] || continue
            name="${d##*/primary-}"
            group="${name##*-}"
            study="${name%-*}"
            mkdir -p "benchmark_modal_primary/$study/$group"
            cp -r "$d/." "benchmark_modal_primary/$study/$group/"
          done
      - run: python ci/modal_primary_mvi_benchmarks.py consolidate benchmark_modal_primary
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-mvi-crossgrid-consolidated
          path: benchmark_modal_primary/consolidated/
          if-no-files-found: warn
