name: KL CC 25Hz Newmark MVI1-8 physical comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/verification/kl_cc_dynamic/**"
      - "ci/kl_cc_newmark_compare.py"
      - "numerics/cylinder_dynamic_case_passport.py"
      - "numerics/cylinder_variational_dynamic.py"
      - "tests/test_dynamic_case_passport.py"
      - ".github/workflows/kl-cc-newmark-physical.yml"
permissions:
  contents: read
jobs:
  run-physical:
    name: "KL Newmark physical: ${{ matrix.case }}"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - MKR_FDM
          - MVI1
          - MVI2
          - MVI3
          - MVI4
          - MVI5
          - MVI6
          - MVI7
          - MVI8
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run two real Newmark steps; propagate actual solver exit
        shell: bash
        run: |
          mkdir -p kl_newmark_logs
          set +e
          python RUN_FINAL_CASE.py "config/verification/kl_cc_dynamic/KL_CC_9x9_HARMONIC25HZ_${{ matrix.case }}.json" > "kl_newmark_logs/${{ matrix.case }}.log" 2>&1
          code=$?
          set -e
          printf '{"case":"%s","exit_code":%s}\n' "${{ matrix.case }}" "$code" > "kl_newmark_logs/${{ matrix.case }}.json"
          tail -n 38 "kl_newmark_logs/${{ matrix.case }}.log"
          echo "DYNAMIC_SOLVER_EXIT_CODE=$code"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kl-cc-newmark-${{ matrix.case }}
          path: |
            kl_newmark_logs/${{ matrix.case }}.*
            config/verification/kl_cc_dynamic/output/KL_CC_9x9_HARMONIC25HZ_${{ matrix.case }}/
          if-no-files-found: warn
          retention-days: 14
  compare:
    name: Compare real time histories of all MVI ranks against FDM
    runs-on: ubuntu-latest
    needs: run-physical
    if: always()
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: "kl-cc-newmark-*"
          path: downloaded
          merge-multiple: true
      - name: Restore physical results from independent jobs
        shell: bash
        run: |
          mkdir -p config/verification/kl_cc_dynamic/output
          if [ -d downloaded/config/verification/kl_cc_dynamic/output ]; then
            cp -r downloaded/config/verification/kl_cc_dynamic/output/. config/verification/kl_cc_dynamic/output/
          fi
          python ci/kl_cc_newmark_compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kl-cc-newmark-comparative-table
          path: |
            config/verification/kl_cc_dynamic/KL_CC_NEWMARK_COMPARE.csv
            config/verification/kl_cc_dynamic/KL_CC_NEWMARK_COMPARE.json
            downloaded/kl_newmark_logs/*.log
          if-no-files-found: warn
          retention-days: 14
