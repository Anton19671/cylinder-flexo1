name: CUF TE4 MVI1 and MVI8 physical 120-step dynamics now
run-name: "REAL MVI-1 / MVI-8 CUF TE4 120 steps at ${{ github.sha }}"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cuf-te4-mvi-real-120-step-start-now.yml"
permissions:
  contents: read
jobs:
  stage_01:
    name: "CUF TE4 physical MVI-${{ matrix.rank }} accepted steps 1-10"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rank: [1, 8]
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real physical shell solver
        run: python -m pip install -r requirements.txt
      - name: Generate 120-step MVI-${{ matrix.rank }} CUF TE4 case with same FDM physics
        shell: bash
        env:
          RANK: ${{ matrix.rank }}
        run: |
          python ci/generate_linear_bathe_case.py \
            --theory CUF_TE4 --method MVI --rank "$RANK" \
            --steps 120 --dt 0.002 --output config/verification/cuf_te4_mvi_now
          python - <<'PY'
          import json,os
          from pathlib import Path
          from generate_linear_bathe_case import make_case
          rank=int(os.environ["RANK"])
          case=json.loads(Path("config/verification/cuf_te4_mvi_now/CUF_TE4_MVI"+str(rank)+".json").read_text(encoding="utf-8"))
          fdm=make_case("CUF_TE4","FDM",None,120,.002,"CUF_TE4_FDM")
          shared=("solver_backend","theory","cuf_model","calculation_kind",
                  "scale_model","mode","geometry_model","material_model",
                  "material","geometry","quadrature","boundary_conditions",
                  "load_definition","dynamics","units")
          for key in shared:
              if case[key]!=fdm[key]:
                  raise ValueError("MVI_FDM_PHYSICAL_INPUT_DIFFERENCE:"+key)
          assert case["method"]=="MVI" and case["rank"]==rank
          assert case["mvi_grid"]=={"nx":9,"ns":9,"operator_scheme":"SBP42_FOURIER_ODD"}
          assert case["dynamics"]["n_steps"]==120
          assert case["dynamics"]["time_step_s"]==0.002
          assert case["dynamics"]["time_law"]["frequency_hz"]==25
          assert case["load_definition"]["q"]==100000
          print("REAL_CUF_TE4_MVI_IDENTICAL_FDM_PHYSICS",rank,flush=True)
          PY
      - name: Execute up to ten NEW true variational Bathe MVI-${{ matrix.rank }} steps
        shell: bash
        env:
          RANK: ${{ matrix.rank }}
        run: |
          set -o pipefail
          python -u ci/run_bathe_checkpoint_batch.py \
            "config/verification/cuf_te4_mvi_now/CUF_TE4_MVI${RANK}.json" --new-steps 10
      - name: Export all physically accepted substeps and chart-ready time data
        if: always()
        shell: bash
        env:
          RANK: ${{ matrix.rank }}
        run: |
          if [ -f "config/verification/cuf_te4_mvi_now/output/CUF_TE4_MVI${RANK}/FINAL_RUN_SUMMARY.json" ]; then
            python ci/export_bathe_te4_history.py \
              "config/verification/cuf_te4_mvi_now/output/CUF_TE4_MVI${RANK}"
          else
            echo "MVI has not produced an accepted physical summary."
          fi
      - name: Preserve real accepted MVI-${{ matrix.rank }} fields and graphs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CUF_TE4_MVI_${{ matrix.rank }}_STAGE_01_ACCEPTED
          path: config/verification/cuf_te4_mvi_now/
          retention-days: 60
          if-no-files-found: warn

