name: G3D Gz electric and dynamic focused audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/electric-gradient-dynamic-audit.yml"
      - "flexoelectric/**"
      - "mechanics/**"
      - "numerics/**"
      - "interface/cylinder_reference_case.py"
      - "tests/test_dynamic_electric_g3d_gz_consistency.py"
      - "tests/test_gradient_model_gz.py"
      - "tests/test_variational_dynamic.py"
      - "tests/test_electric_charge_sign_audit.py"
permissions:
  contents: read
jobs:
  electric:
    name: G3D-Gz enthalpy and charge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run physical gradient and electric tests
        run: |
          python -c 'from cylinder_paths import activate; activate(); import pytest; raise SystemExit(pytest.main([
            "-q", "--junitxml=g3d-gz-electric.xml",
            "tests/test_flexo_gradient_g3d.py",
            "tests/test_gradient_model_gz.py",
            "tests/test_flexo_switch.py",
            "tests/test_all_seven_flexo_gradient_nonzero.py",
            "tests/test_electric_charge_sign_audit.py",
            "tests/test_electric_face_flux.py",
            "tests/test_even_grid_electric_coupling.py",
            "tests/test_gauss2_cubic_electric_rank_growth.py",
            "tests/test_cuf_g3d_weak.py",
            "tests/test_coupled_principal_symbol.py",
            "tests/test_coupled_principal_symbol_physical.py"
          ]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3d-gz-electric-physics-py311
          path: g3d-gz-electric.xml
          if-no-files-found: warn
  dynamics:
    name: Seven-theory electric response and Newmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run dynamic electromechanical tests
        run: |
          python -c 'from cylinder_paths import activate; activate(); import pytest; raise SystemExit(pytest.main([
            "-q", "--junitxml=g3d-gz-dynamics.xml",
            "tests/test_dynamic_electric_g3d_gz_consistency.py",
            "tests/test_variational_dynamic.py",
            "tests/test_kl_g3d_newmark.py",
            "tests/test_kelvin_voigt_all_theories.py",
            "tests/test_sbp_dynamic_green.py",
            "tests/test_newmark_audit.py",
            "tests/test_dynamic_mvi_initial_rank.py",
            "tests/test_dynamic_mvi_time_separation_contract.py",
            "tests/test_dynamic_comparison.py",
            "tests/test_newmark_gauss2_comparison.py"
          ]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3d-gz-dynamic-newmark-py311
          path: g3d-gz-dynamics.xml
          if-no-files-found: warn
