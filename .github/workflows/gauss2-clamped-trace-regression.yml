name: Gauss IRK4 rank-fixed MVI trace regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "numerics/cylinder_gauss2_mvi.py"
      - "tests/test_gauss2_trace_rank_floor.py"
      - ".github/workflows/gauss2-clamped-trace-regression.yml"
permissions:
  contents: read
jobs:
  trace-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Distinguish roundoff-only and physically required traces
        run: python -m pytest -q tests/test_gauss2_trace_rank_floor.py tests/test_cylinder_gauss2_mvi.py
