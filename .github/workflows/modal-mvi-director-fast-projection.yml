name: Modal MVI FSDT Reddy exact K-M rank regression
on:
  push:
    branches: [main]
    paths:
      - "numerics/cylinder_modal_mvi.py"
      - "numerics/cylinder_modal_separated_projector.py"
      - "tests/test_modal_mvi_director_fast_projection.py"
      - ".github/workflows/modal-mvi-director-fast-projection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_projection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install solver requirements
        run: python -m pip install -r requirements.txt
      - name: Compare original weak actions to exact 1D projected operators
        run: python -m pytest -q tests/test_modal_mvi_director_fast_projection.py tests/test_modal_mvi_separated_cuf_projection.py
