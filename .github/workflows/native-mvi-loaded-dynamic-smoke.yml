name: Native MVI loaded three-integrator physical dynamic control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci/native_coupled_mvi_loaded_dynamic_smoke.py"
      - "independent_mvi/coupled_gauss2.py"
      - "independent_mvi/coupled_halfstep.py"
      - "independent_mvi/coupled_rank_endpoint.py"
      - ".github/workflows/native-mvi-loaded-dynamic-smoke.yml"
# Recheck after fixed-rank Gauss stage interpolation correction.
permissions:
  contents: read
jobs:
  loaded-mvi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install physical numerical dependencies
        run: python -m pip install numpy scipy
      - name: Physically loaded KL rank-one independent MVI Newmark Bathe Gauss
        run: python -u ci/native_coupled_mvi_loaded_dynamic_smoke.py
