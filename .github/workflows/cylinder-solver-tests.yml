name: Cylinder Flexoelectric G3D/Gz
# Manual until runner quota permits scheduled/push verification.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Python 3.11 / elastic shell coupled tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax of retained modules
        run: |
          python -m compileall -q interface mechanics numerics physics flexoelectric tests
      - name: Imports and physical modes
        run: |
          python -c 'from cylinder_paths import activate; activate(); import pytest; raise SystemExit(pytest.main(["-q","tests/test_repository_integrity.py","tests/test_elastic_only_entrypoints.py"]))'
      - name: Coupled G3D/Gz and numerical regression
        run: |
          python -c 'from cylinder_paths import activate; activate(); import pytest; raise SystemExit(pytest.main(["-q","tests"]))'
