name: Cylinder Flexo Solver Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cylinder-solver-tests.yml"
      - "interface/**"
      - "mechanics/**"
      - "numerics/**"
      - "physics/**"
      - "flexoelectric/**"
      - "models/**"
      - "mvi/**"
      - "mkr/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - "cylinder_paths.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.11 / variational solver tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Syntax of solver modules
        run: |
          python -m compileall -q interface mechanics numerics physics flexoelectric models mvi mkr tests

      - name: Dynamics, damping, boundaries and GUI regression tests
        run: |
          python -c 'from cylinder_paths import activate; activate(); import pytest; raise SystemExit(pytest.main(["-q", "tests/test_variational_dynamic.py", "tests/test_boundary_spatial.py", "tests/test_variational_boundary.py", "tests/test_dynamic_loads.py", "tests/test_reference_gui.py"]))'

      - name: All solver unit tests
        if: success()
        run: |
          python -c 'from cylinder_paths import activate; activate(); import pytest; raise SystemExit(pytest.main(["-q", "tests"]))'
