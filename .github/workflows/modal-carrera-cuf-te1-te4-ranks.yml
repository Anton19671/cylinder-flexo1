name: Carrera CUF TE1 TE4 MVI 1-8 modal verification
on:
  push:
    branches: [main]
    paths:
      - 'ci/modal_carrera_cuf_te1_te4_mvi_all_ranks.py'
      - '.github/workflows/modal-carrera-cuf-te1-te4-ranks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        group: [low, high]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: '.:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compare TE and each MVI rank with full FDM
        run: python ci/modal_carrera_cuf_te1_te4_mvi_all_ranks.py ${{ matrix.model }} ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrera-${{ matrix.model }}-${{ matrix.group }}
          path: benchmark_carrera_cuf_te_ranks/${{ matrix.model }}/${{ matrix.group }}/
          if-no-files-found: warn
