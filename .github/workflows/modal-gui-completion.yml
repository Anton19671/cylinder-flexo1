name: Modal GUI UTF8 and verified completion
on:
  push:
    branches: [main]
    paths:
      - 'interface/cylinder_gui_run_feedback.py'
      - 'interface/FINAL_GUI.py'
      - 'tests/test_modal_gui_completion_feedback.py'
      - '.github/workflows/modal-gui-completion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: '.:interface'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_modal_gui_completion_feedback.py
