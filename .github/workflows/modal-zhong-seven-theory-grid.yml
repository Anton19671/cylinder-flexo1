name: "Zhong: all seven shell theories matched-grid modal frequencies"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/modal-zhong-seven-theory-grid.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-theory:
    name: ${{ matrix.theory }} ${{ matrix.grid }}x${{ matrix.grid }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        theory: [KL, FSDT, REDDY, CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        grid: [21, 33]
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify angular Fourier modal operator
        run: python -m pytest -q tests/test_modal_fourier_fdm.py tests/test_modal_fourier_thin_shell_accuracy.py
      - name: Compute theory-specific FDM frequencies and mode fields
        run: python ci/modal_rawat_grid_theory_study.py "${{ matrix.theory }}" "${{ matrix.grid }}"
      - name: Save each physical model report, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhong-seven-${{ matrix.theory }}-${{ matrix.grid }}
          path: |
            modal_rawat_${{ matrix.theory }}_${{ matrix.grid }}x${{ matrix.grid }}_report.json
            modal_rawat_${{ matrix.theory }}_${{ matrix.grid }}x${{ matrix.grid }}_fields.npz
          if-no-files-found: warn
