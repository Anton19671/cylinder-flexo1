name: Native coupled strong MKR assembled runner contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "numerics/cylinder_native_mkr_*.py"
      - "independent_mkr/run_coupled_research.py"
      - "interface/cylinder_independent_dispatch.py"
      - "interface/cylinder_native_research_gui.py"
      - "interface/RUN_FINAL_CASE.py"
      - "tests/test_native_coupled_mkr_case_dispatch.py"
      - ".github/workflows/native-coupled-mkr-no-solve.yml"
permissions:
  contents: read
jobs:
  strong-mkr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install algebra-only dependencies
        run: python -m pip install numpy scipy pytest
      - name: Check assembled native runner GUI and strong modules syntax
        run: |
          python -m py_compile \
            numerics/cylinder_native_mkr_end_program.py \
            numerics/cylinder_native_mkr_face_recovery.py \
            independent_mkr/run_coupled_research.py \
            independent_mvi/run_coupled_research.py \
            interface/cylinder_native_run_control.py \
            interface/cylinder_native_research_gui.py \
            interface/RUN_FINAL_CASE.py \
            interface/cylinder_independent_dispatch.py
      - name: Own strong MKR 7x3 CASE routing and physical end preflight (no shell)
        run: python -m pytest -q tests/test_native_coupled_mkr_case_dispatch.py
