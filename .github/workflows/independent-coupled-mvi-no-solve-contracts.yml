# Algebra-only tests; no loaded cylinder, no physical time-history.
# Check generalized native MVI end work and outward-normal sign contracts.
# Guard against implicit SVD use in floating electric gauge linear algebra.
# Protect all user-requested MVI ranks against QR loss of dormant X/Y profiles.
name: Independent coupled MVI algebra and method isolation (no shell runs)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "independent_mvi/coupled_*.py"
      - "independent_mvi/run_coupled_research.py"
      - "interface/cylinder_independent_dispatch.py"
      - "tests/test_independent_coupled_mvi_*.py"
      - ".github/workflows/independent-coupled-mvi-no-solve-contracts.yml"
# Recheck after fixed-rank Gauss stage interpolation correction.
# Rerun invariant axisymmetric Gauss rank-one stage subspace control.
permissions:
  contents: read
jobs:
  mvi-contracts:
    name: MVI seven-theory static dynamic algebra and BC guards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install algebra-only dependencies
        run: python -m pip install numpy scipy pytest
      - name: Syntax check independent MVI modules
        run: |
          python -m py_compile independent_mvi/coupled_operators.py independent_mvi/coupled_surface.py independent_mvi/coupled_halfstep.py independent_mvi/coupled_static.py independent_mvi/coupled_end_actions.py independent_mvi/coupled_inertia.py independent_mvi/coupled_viscosity.py independent_mvi/coupled_newmark.py independent_mvi/coupled_bathe.py independent_mvi/coupled_initial.py independent_mvi/coupled_rank_endpoint.py independent_mvi/coupled_gauss2.py independent_mvi/coupled_discrete_green.py independent_mvi/coupled_dynamic_green.py independent_mvi/coupled_electric_faces.py independent_mvi/coupled_mechanical_end_work.py independent_mvi/run_coupled_research.py interface/cylinder_independent_dispatch.py
      - name: Exact discrete SBP/Fourier boundary identity (no shell run)
        run: python -m pytest -q tests/test_independent_coupled_mvi_discrete_green.py
      - name: Complete dynamic inertia Kelvin-Voigt electric boundary identity
        run: python -m pytest -q tests/test_independent_coupled_mvi_dynamic_green.py
      - name: Physical electric induction and face-charge virtual work contracts
        run: python -m pytest -q tests/test_independent_coupled_mvi_electric_faces.py
      - name: Coupled CASE electric face conversion and fail-closed preflight
        run: python -m pytest -q tests/test_independent_coupled_mvi_case_dispatch.py
      - name: Insulated floating gauge and reduced LU-GMRES Newton (no shell run)
        run: python -m pytest -q tests/test_independent_coupled_mvi_floating_gauge.py
      - name: Generalized mechanical end normal and hypertraction work
        run: python -m pytest -q tests/test_independent_coupled_mvi_mechanical_end_work.py
      - name: MVI large-grid independent acceleration mass Krylov and LU closure
        run: python -m pytest -q tests/test_independent_coupled_mvi_large_acceleration.py
      - name: All 7 theories 8 ranks 3 integrators electric and G3D Gz
        run: python -m pytest -q tests/test_independent_coupled_mvi_all_ranks_case.py
      - name: Real X/Y rank-five and rank-eight nonzero multimode algebra
        run: python -m pytest -q tests/test_independent_coupled_mvi_fixed_rank_multimode.py
      - name: No-solve seven-theory method contract tests
        run: |
          python -m pytest -q \
            tests/test_independent_coupled_mvi_operators.py \
            tests/test_independent_coupled_mvi_surface.py \
            tests/test_independent_coupled_mvi_halfstep.py \
            tests/test_independent_coupled_mvi_static.py \
            tests/test_independent_coupled_mvi_end_actions.py \
            tests/test_independent_coupled_mvi_newmark.py \
            tests/test_independent_coupled_mvi_bathe.py \
            tests/test_independent_coupled_mvi_viscosity.py \
            tests/test_independent_coupled_mvi_endpoint.py \
            tests/test_independent_coupled_mvi_gauss2.py \
            tests/test_independent_coupled_mvi_electric_only.py \
            tests/test_independent_coupled_mvi_weighted_gateaux.py \
            tests/test_independent_coupled_mvi_matrix_free.py
