name: Native loaded KL physical method control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ci/native_coupled_loaded_kl_smoke.py"
      - ".github/workflows/native-loaded-kl-smoke.yml"
permissions:
  contents: read
jobs:
  loaded-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:independent_mkr:independent_mvi:mechanics:numerics:flexoelectric:physics:interface"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      # Check the AUTO-chosen independent strong linear solver;
      # this is not a scientific G3D source benchmark.
      - name: Physical small nonzero-loaded KL strong MKR and rank-1 MVI
        run: python -u ci/native_coupled_loaded_kl_smoke.py
