name: KL physical face virtual work verification
on:
  push:
    branches: [main, fix/kl-physical-face-work]
    paths:
      - "physics/cylinder_kl_face_load.py"
      - "independent_mvi/**"
      - "independent_mkr/run_coupled_research.py"
      - "numerics/cylinder_direct_strong_model.py"
      - "ci/native*"
      - "tests/test_kl_nominal_face_work.py"
      - "tests/test_native*"
      - ".github/workflows/kl-physical-face-work.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-work:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ".:ci:physics:mechanics:numerics:flexoelectric:interface:independent_mvi:independent_mkr"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Analytic tilted director, energy derivative and independent method assembly
        run: python -m pytest -q tests/test_kl_nominal_face_work.py tests/test_native_gradient_fdm_mvi_campaign.py tests/test_native_flexo_face_pressure_parity.py tests/test_native_coupled_live_route_isolation.py
