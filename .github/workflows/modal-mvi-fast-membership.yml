name: Modal MVI dense-QR bottleneck regression
on:
  push:
    branches: [main]
    paths:
      - numerics/cylinder_modal_mvi.py
      - tests/test_modal_mvi_fast_membership.py
      - .github/workflows/modal-mvi-fast-membership.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ".:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Compare physical Y/X membership with original QR and ensure no global QR
        run: python -m pytest -q tests/test_modal_mvi_fast_membership.py tests/test_modal_mvi_projection_cache.py tests/test_modal_mvi_frozen_partner_roundoff.py tests/test_modal_mvi_large_initial_harmonic.py tests/test_modal_mvi_separated_cuf_projection.py
