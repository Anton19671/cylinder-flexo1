name: Coupled Newton, global enthalpy and boundary audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/coupled-newton-scientific.yml"
      - "tests/test_scientific_global_coupled_newton.py"
      - "mechanics/cylinder_functional_assembly.py"
      - "mechanics/cylinder_variational_boundary.py"
      - "numerics/cylinder_boundary_spatial.py"
      - "numerics/cylinder_variational_dynamic.py"
      - "flexoelectric/cuf_g3d_weak.py"
      - "flexoelectric/flexo_gradient_g3d.py"
permissions:
  contents: read
jobs:
  scientific-newton:
    name: Seven-theory global coupled work and restricted Newton cross blocks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ".:mechanics:flexoelectric:numerics:physics"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install algebraic audit dependencies
        run: python -m pip install numpy scipy pytest
      - name: Syntax and global coupled Newton/BC audit
        run: |
          python -m py_compile tests/test_scientific_global_coupled_newton.py
          python -m pytest -q tests/test_scientific_global_coupled_newton.py

  local-reciprocity:
    name: Seven theories x G3D/Gz local electromechanical tangent reciprocity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        theory: [KL, FSDT, REDDY, CUF_TE1, CUF_TE2, CUF_TE3, CUF_TE4]
        gradient: [G3D, GZ]
    env:
      PYTHONPATH: ".:mechanics:flexoelectric:numerics:physics"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CYLINDER_LOCAL_SYMBOL_AUDIT: "1"
      THEORY: ${{ matrix.theory }}
      GRADIENT: ${{ matrix.gradient }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy scipy pytest
      - name: Evaluate actual local constitutive kernels and tangent conjugacy
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_coupled_principal_symbol_physical.py -k "${THEORY} and ${GRADIENT}" --junitxml=reciprocity.xml
      - name: Preserve independent local material audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FLEXO_LOCAL_RECIPROCITY_${{ matrix.theory }}_${{ matrix.gradient }}
          path: reciprocity.xml
          if-no-files-found: warn
          retention-days: 60
