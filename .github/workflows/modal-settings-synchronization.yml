name: Modal settings synchronization smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'interface/cylinder_reference_method_switch.py'
      - 'interface/cylinder_reference_gui.py'
      - 'interface/FINAL_GUI.py'
      - 'numerics/cylinder_modal_reference.py'
      - 'tests/test_reference_method_switch.py'
      - 'tests/test_modal_operator_normalization.py'
      - '.github/workflows/modal-settings-synchronization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: '.:ci:numerics:mechanics:physics:flexoelectric:interface:mvi:mkr:models'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Syntax and settings tests only (no solver calculations)
        run: |
          python -m compileall -q interface/cylinder_reference_method_switch.py interface/cylinder_reference_gui.py interface/FINAL_GUI.py
          python -m pytest -q tests/test_reference_method_switch.py tests/test_modal_operator_normalization.py tests/test_modal_gui_completion_feedback.py
